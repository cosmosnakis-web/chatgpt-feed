name: ChatGPT urun feed
on:
  schedule:
    - cron: "17 * * * *"   # her saat (UTC)
  workflow_dispatch:
  push:
    paths: ["feed.py", ".github/workflows/feed.yml"]
permissions:
  contents: write
concurrency: feed
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python feed.py
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          git diff --cached --quiet || (git commit -m "feed: $(date -u +%F' '%H:%M)" && git push)
